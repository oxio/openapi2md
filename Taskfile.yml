version: '3'

vars:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOLANGCI_LINT:
    sh: command -v golangci-lint 2>/dev/null || echo "go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}"
  BINARY: bin/openapi2md
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X github.com/oxio/openapi2md/cmd.Version={{.VERSION}}

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Build the binary into bin/
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BINARY}} .

  test:
    desc: Run tests
    cmds:
      - go test ./...

  cover:
    desc: Run tests with coverage
    cmds:
      - go test -cover ./...

  fmt:
    desc: Format Go source files in place
    cmds:
      - gofmt -w .

  "fmt:check":
    desc: Check Go source formatting (fails if any file is unformatted)
    silent: true
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "$unformatted"
          echo "Unformatted files listed above; run 'task fmt'."
          exit 1
        fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - "{{.GOLANGCI_LINT}} run ./..."

  "lint:fix":
    desc: Run golangci-lint with auto-fixes
    cmds:
      - "{{.GOLANGCI_LINT}} run --fix ./..."

  tidy:
    desc: Tidy module dependencies
    cmds:
      - go mod tidy

  check:
    desc: Run formatting check, vet, lint, build, and tests
    cmds:
      - task: "fmt:check"
      - task: vet
      - task: lint
      - task: build
      - task: test

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin
